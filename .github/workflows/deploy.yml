name: Build and Deploy React App

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest .

      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

      # 5. Test EC2 SSH port
      - name: Test EC2 Port 22
        run: |
          echo "Testing connection to EC2 on port 22..."

          nc -zv -w 15 "${{ secrets.EC2_HOST }}" 22

          echo "EC2 port 22 is reachable from GitHub Actions"

      # 6. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m

          script: |
            echo "======================================"
            echo "Starting deployment..."
            echo "======================================"

            # Pull latest image
            echo "Pulling latest Docker image..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

            # Stop old container
            echo "Stopping old container..."

            docker stop react-app || true

            # Remove old container
            echo "Removing old container..."

            docker rm react-app || true

            # Start new container
            echo "Starting new container..."

            docker run -d \
              --name react-app \
              --restart unless-stopped \
              -p 3000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

            echo "Waiting for application to start..."

            sleep 10

            # Check Docker container
            echo "======================================"
            echo "Checking Docker container status..."
            echo "======================================"

            if docker ps --filter "name=react-app" --filter "status=running" | grep -q react-app; then
              echo "✅ Docker container is running"
            else
              echo "❌ Docker container is NOT running"
              echo "Container logs:"
              docker logs react-app
              exit 1
            fi

            # Application health check
            echo "======================================"
            echo "Checking application health..."
            echo "======================================"

            if curl -f --max-time 10 http://localhost:3000 > /dev/null; then
              echo "✅ Application is UP and responding"
              echo "✅ HTTP health check passed"
            else
              echo "❌ Application health check FAILED"
              echo "Application is not responding on port 3000"
              echo "Container logs:"
              docker logs react-app
              exit 1
            fi

            echo "======================================"
            echo "Final container status:"
            echo "======================================"

            docker ps

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "Application is healthy and running."
            echo "======================================"
