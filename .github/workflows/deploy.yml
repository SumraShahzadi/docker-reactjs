
name: Build and Deploy React App

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest .

      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

      # 5. Test EC2 SSH port
      - name: Test EC2 Port 22
        run: |
          echo "Testing connection to EC2 on port 22..."

          nc -zv -w 15 "${{ secrets.EC2_HOST }}" 22

          echo "EC2 port 22 is reachable from GitHub Actions"

      # 6. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m

          script: |
            echo "Starting deployment..."

            echo "Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

            echo "Stopping old container..."
            docker stop react-app || true

            echo "Removing old container..."
            docker rm react-app || true

            echo "Starting new container..."
            docker run -d \
              --name react-app \
              --restart unless-stopped \
              -p 3000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

            echo "Checking container..."
            docker ps

            echo "Deployment completed successfully!"
