name: Build and Deploy React App

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

      - name: Test EC2 Port 22
        run: |
          echo "Testing connection to EC2 on port 22..."

          timeout 15 bash -c \
            "</dev/tcp/${{ secrets.EC2_HOST }}/22"

          echo "✅ EC2 port 22 is reachable from GitHub Actions"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m

          script: |
            echo "Starting deployment..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

            docker stop react-app || true
            docker rm react-app || true

            docker run -d \
              --name react-app \
              --restart unless-stopped \
              -p 3000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

            echo "Deployment completed successfully!"

            docker ps
